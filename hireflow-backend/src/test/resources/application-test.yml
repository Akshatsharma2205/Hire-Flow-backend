# ── Automated test profile: isolated H2 database, local storage, fast worker ──
spring:
  datasource:
    url: jdbc:h2:mem:hireflow-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

hireflow:
  storage:
    provider: local
    local-base-path: ./target/test-storage
    local-url-secret: hireflow-test-hmac-key
  ai:
    provider: local
  worker:
    poll-ms: 250
    batch-size: 20
    stale-after-minutes: 5

logging:
  level:
    com.kartgen.hireflow: INFO
    org.springframework: WARN
    org.hibernate: WARN
