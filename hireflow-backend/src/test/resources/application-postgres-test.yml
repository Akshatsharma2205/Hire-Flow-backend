spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hireflow_test}
    username: ${DB_USERNAME:hireflow_user}
    password: ${DB_PASSWORD:hireflow_ci_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

hireflow:
  storage:
    provider: local
    local-base-path: ./target/test-storage-pg
    local-url-secret: hireflow-test-hmac-key
  ai:
    provider: local
  worker:
    poll-ms: 250
    batch-size: 10
    stale-after-minutes: 5

logging:
  level:
    com.kartgen.hireflow: INFO
    org.flywaydb: INFO
