# ── Local development profile (H2 in PostgreSQL mode, zero Docker) ──
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:hireflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db/migration

hireflow:
  storage:
    provider: local
  ai:
    provider: local

logging:
  level:
    com.kartgen.hireflow: DEBUG
    org.springframework.security: INFO
