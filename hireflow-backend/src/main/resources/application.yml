# ── Spring Boot common configuration ──
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  forward-headers-strategy: framework

spring:
  application:
    name: hireflow
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
      file-size-threshold: 1MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true

# ── HireFlow custom properties ──
hireflow:
  jwt:
    secret: ${JWT_SECRET:CHANGE-ME-local-dev-jwt-secret-key-at-least-256-bits-long-0123456789}
    issuer: hireflow
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  crypto:
    secret-key: ${CRYPTO_SECRET_KEY:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-base-path: ${LOCAL_STORAGE_PATH:./.local-storage/s3-bucket}
    local-url-secret: ${LOCAL_URL_SECRET:hireflow-local-hmac-key}
    s3-bucket: ${S3_BUCKET:}
    s3-region: ${S3_REGION:ap-south-1}
    s3-endpoint: ${S3_ENDPOINT:}
    s3-path-style: ${S3_PATH_STYLE:false}
    s3-presigned-expiry-minutes: ${S3_PRESIGNED_EXPIRY_MINUTES:15}
  ai:
    provider: ${AI_PROVIDER:local}
    endpoint-url: ${AI_ENDPOINT_URL:http://localhost:5000/api/extract}
    api-key: ${AI_API_KEY:}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:60000}
  webhook:
    enabled: ${WEBHOOK_ENABLED:true}
    replay-window-seconds: ${WEBHOOK_REPLAY_WINDOW_SECONDS:300}
    max-body-bytes: ${WEBHOOK_MAX_BODY_BYTES:26214400}
    max-attachments: ${WEBHOOK_MAX_ATTACHMENTS:20}
    max-attachment-bytes: ${WEBHOOK_MAX_ATTACHMENT_BYTES:10485760}
    max-total-attachment-bytes: ${WEBHOOK_MAX_TOTAL_ATTACHMENT_BYTES:16777216}
    max-parts: ${WEBHOOK_MAX_PARTS:32}
    max-metadata-bytes: ${WEBHOOK_MAX_METADATA_BYTES:16384}
    max-header-bytes: ${WEBHOOK_MAX_HEADER_BYTES:8192}
    max-concurrent-requests: ${WEBHOOK_MAX_CONCURRENT_REQUESTS:4}
    # Local development is opt-in. There is deliberately no default secret:
    # set WEBHOOK_LOCAL_DEV_ENABLED=true and WEBHOOK_LOCAL_DEV_SECRET=<32+ chars>.
    local-dev-enabled: ${WEBHOOK_LOCAL_DEV_ENABLED:false}
    local-dev-secret: ${WEBHOOK_LOCAL_DEV_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,chrome-extension://*}
  oauth:
    google-client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    google-client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    google-token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
    gmail-base-url: ${GMAIL_BASE_URL:https://gmail.googleapis.com/gmail/v1}
    microsoft-client-id: ${MS_OAUTH_CLIENT_ID:}
    microsoft-client-secret: ${MS_OAUTH_CLIENT_SECRET:}
    microsoft-tenant: ${MS_OAUTH_TENANT:common}
    microsoft-token-uri-template: ${MS_OAUTH_TOKEN_URI_TEMPLATE:https://login.microsoftonline.com/{tenant}/oauth2/v2.0/token}
    graph-base-url: ${MS_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
  worker:
    poll-ms: ${WORKER_POLL_MS:2000}
    batch-size: ${WORKER_BATCH_SIZE:10}
    stale-after-minutes: ${WORKER_STALE_MINUTES:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
