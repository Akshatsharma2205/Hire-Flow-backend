name: HireFlow CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        working-directory: hireflow-backend
        run: |
          sed -i 's/\r$//' mvnw || true
          chmod +x mvnw
          ./mvnw test --batch-mode > maven-build.log 2>&1 || {
            tail -n 100 maven-build.log
            node -e '
              const fs = require("fs");
              if (fs.existsSync("maven-build.log")) {
                const log = fs.readFileSync("maven-build.log", "utf8");
                const lines = log.split(/\r?\n/).filter(l => l.trim());
                const tail = lines.slice(-30).join("%0A");
                console.log("::error title=Maven Failure Tail::" + tail);
              }
              const dir = "target/surefire-reports";
              if (fs.existsSync(dir)) {
                for (const f of fs.readdirSync(dir)) {
                  if (f.endsWith(".txt")) {
                    const c = fs.readFileSync(dir + "/" + f, "utf8");
                    if (c.includes("FAILURE!") || c.includes("ERROR!")) {
                      console.log("::error title=" + f + "::" + c.slice(0, 500).replace(/\r?\n/g, "%0A"));
                    }
                  }
                }
              }
            '
            exit 1
          }

      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: hireflow-backend/target/surefire-reports/

      - name: Package Backend Artifact
        working-directory: hireflow-backend
        run: |
          ./mvnw package -DskipTests --batch-mode

  extension-test:
    name: Extension Test Suite (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Extension Unit & Security Tests
        run: |
          node --test hireflow-extension/test/extension.test.js

  repo-hygiene:
    name: Repository Hygiene & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Uncommitted Build Artifacts
        run: |
          if [ -d "hireflow-backend/target" ]; then
            echo "Error: target/ directory must not be tracked in Git"
            exit 1
          fi
          if [ -d "hireflow-backend/.jdk" ]; then
            echo "Error: .jdk/ directory must not be tracked in Git"
            exit 1
          fi
          if [ -d "hireflow-backend/.local-storage" ]; then
            echo "Error: .local-storage/ directory must not be tracked in Git"
            exit 1
          fi

      - name: Verify Documentation Completeness
        run: |
          for doc in README.md REPOSITORY_STRUCTURE.md docs/ARCHITECTURE.md docs/API_REFERENCE.md docs/DATABASE.md docs/CLASS_REFERENCE.md docs/SECURITY.md docs/TESTING.md docs/EXTENSION.md docs/FINAL_VERIFICATION_REPORT.md; do
            if [ ! -f "$doc" ]; then
              echo "Missing required documentation file: $doc"
              exit 1
            fi
          done
          echo "All required documentation files present."
