name: HireFlow CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Tests
        working-directory: hireflow-backend
        run: |
          sed -i 's/\r$//' mvnw || true
          chmod +x mvnw
          ./mvnw test --batch-mode

      - name: Upload Surefire Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: hireflow-backend/target/surefire-reports/

      - name: Package Backend Artifact
        working-directory: hireflow-backend
        run: |
          ./mvnw package -DskipTests --batch-mode

  extension-test:
    name: Extension Test Suite (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Extension Unit & Security Tests
        run: |
          node --test hireflow-extension/test/extension.test.js

  repo-hygiene:
    name: Repository Hygiene & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check for Uncommitted Build Artifacts
        run: |
          if [ -d "hireflow-backend/target" ]; then
            echo "Error: target/ directory must not be tracked in Git"
            exit 1
          fi
          if [ -d "hireflow-backend/.jdk" ]; then
            echo "Error: .jdk/ directory must not be tracked in Git"
            exit 1
          fi
          if [ -d "hireflow-backend/.local-storage" ]; then
            echo "Error: .local-storage/ directory must not be tracked in Git"
            exit 1
          fi

      - name: Scan for Exposed High-Risk Secrets
        run: |
          echo "Scanning for hardcoded credentials, private keys, and API tokens..."
          SECRETS_FOUND=0
          if git grep -I -E "BEGIN (RSA|EC|DSA|OPENSSH|PGP) PRIVATE KEY" -- ':!*.md' ':!*.txt' ; then
            echo "Error: Private key found in repository!"
            SECRETS_FOUND=1
          fi
          if git grep -I -E "AKIA[0-9A-Z]{16}" -- ':!*.md' ':!*.txt' ; then
            echo "Error: AWS Access Key ID pattern found!"
            SECRETS_FOUND=1
          fi
          if git grep -I -E "gh[pousr]_[0-9A-Za-z]{36}" -- ':!*.md' ':!*.txt' ; then
            echo "Error: GitHub personal token found!"
            SECRETS_FOUND=1
          fi
          if [ $SECRETS_FOUND -ne 0 ]; then
            exit 1
          fi
          echo "Secret scan passed cleanly. No exposed credentials found."

      - name: Verify Documentation Completeness
        run: |
          for doc in README.md AGENTS.md REPOSITORY_STRUCTURE.md docs/AGENT_GUIDE.md docs/ARCHITECTURE.md docs/API_REFERENCE.md docs/DATABASE.md docs/CLASS_REFERENCE.md docs/DEPLOYMENT.md docs/OPERATIONS.md docs/SECURITY.md docs/TESTING.md docs/EXTENSION.md docs/FINAL_VERIFICATION_REPORT.md; do
            if [ ! -f "$doc" ]; then
              echo "Missing required documentation file: $doc"
              exit 1
            fi
          done
          echo "All required documentation files present."
